                <p class="text-xs text-amber-700 mt-1">صوّر كلمة المرور أو اكتبها في مكان آمن، لأن الموقع مش بيقدر يظهرها لك بعد كده.</p>

            <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl shadow hover:bg-emerald-700 transition">تسجيل وإنشاء المحل</button>

</div>

<!-- Lightbox -->
<div id="lightbox" class="modal-hidden fixed inset-0 bg-black/90 z-[70] flex items-center justify-center p-3" data-action="closeZoom">
    <button class="absolute top-4 left-4 text-white text-3xl" data-action="closeZoom"><i class="fa-solid fa-xmark"></i></button>
    <img id="lightboxImg" alt="" class="max-w-full max-h-full rounded-lg">

<div id="toast" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 z-[80] bg-gray-900 text-white text-sm px-4 py-2 rounded-xl shadow-lg max-w-[90vw] text-center"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, setPersistence, browserLocalPersistence, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, orderBy, query, serverTimestamp, increment, writeBatch, Timestamp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ============================================================
   إعدادات Firebase
   ============================================================ */
const firebaseConfig = {
    apiKey: "AIzaSyCVKH5QK0ZeTLMpvzHsaLhCuCGh0x3WzsI",
    authDomain: "sawaqi.firebaseapp.com",
    projectId: "sawaqi",
    appId: "1:372720770718:web:2f5a462bf013de8066258f"
};

const CATEGORIES = ['ملابس وأحذية', 'مطاعم', 'صيدليات', 'سوبر ماركت', 'خدمات وصيانة'];
const CAT_ICON = { 'ملابس وأحذية': '👕', 'مطاعم': '🍔', 'صيدليات': '💊', 'سوبر ماركت': '🛒', 'خدمات وصيانة': '🔧' };
const ICONS = ['🏪', '🛍️', '👕', '👟', '🍔', '🍕', '☕', '🍞', '🥩', '🥦', '💊', '🛒', '🔧', '⚡', '🚗', '📱', '✂️', '🪑', '🏠', '📚'];
const JOBS = ['سباك', 'كهربائي', 'نجار', 'حداد', 'نقاش', 'ميكانيكي', 'سواق', 'فني تكييف', 'فني غسالات', 'فني موبايلات', 'بناء', 'مبلّط', 'طبيب', 'ممرض', 'مدرس', 'بيطري', 'مزارع', 'توصيل'];
const MAX_PRODUCTS = 30;
const DEFAULT_SUPPORT = ['01118465764'];
const EMAIL_DOMAIN = '@sawaqi-users.com';

const configured = !firebaseConfig.apiKey.startsWith('PUT_');
let auth, db;
if (configured) {
    const app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db = getFirestore(app);
    setPersistence(auth, browserLocalPersistence).catch(() => {});
} else {
    document.getElementById('configBanner').classList.remove('hidden');
}

/* ================= Helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeImg = s => typeof s === 'string' && s.startsWith('data:image/');

function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.remove('hidden');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.add('hidden'), 3500);
}

// أي صيغة لرقم مصري -> 01XXXXXXXXX
function normPhone(p) {
    let d = String(p || '').replace(/\D/g, '');
    if (d.startsWith('0020')) d = d.slice(4);
    else if (d.startsWith('20') && d.length === 12) d = d.slice(2);
    if (d.length === 10 && d.startsWith('1')) d = '0' + d;
    return d;
}
const validPhone = p => /^01[0125]\d{8}$/.test(p);
const intl = local => '2' + local;                 // 01012345678 -> 201012345678
const phoneEmail = local => intl(local) + EMAIL_DOMAIN;
const waLink = (local, text) => `https://wa.me/${intl(local)}${text ? '?text=' + encodeURIComponent(text) : ''}`;

async function copyText(text) {
    try { await navigator.clipboard.writeText(text); }
    catch {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch {}
        ta.remove();
    }
    toast('تم النسخ: ' + text);
}

// تصغير الصورة قبل الحفظ
function compressImage(file, { max = 500, quality = 0.7, limit = 110000 } = {}) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
            let { width: w, height: h } = img;
            const scale = Math.min(1, max / Math.max(w, h));
            w = Math.round(w * scale); h = Math.round(h * scale);
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            c.getContext('2d').drawImage(img, 0, 0, w, h);
            URL.revokeObjectURL(url);
            let q = quality, out = c.toDataURL('image/jpeg', q);
            while (out.length > limit && q > 0.3) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
            if (out.length > limit * 1.6) return reject(new Error('الصورة كبيرة جداً، جرب صورة تانية'));
            resolve(out);
        };
        img.onerror = () => reject(new Error('ملف الصورة غير صالح'));
        img.src = url;
    });
}

function authError(e) {
    const m = {
        'auth/email-already-in-use': 'الرقم ده مسجل قبل كده، جرب تدخل.',
        'auth/invalid-email': 'رقم الموبايل غير صحيح.',
        'auth/weak-password': 'كلمة المرور ضعيفة (6 على الأقل).',
        'auth/invalid-credential': 'الرقم أو كلمة المرور غلط.',
        'auth/user-not-found': 'الرقم أو كلمة المرور غلط.',
        'auth/wrong-password': 'الرقم أو كلمة المرور غلط.',
        'auth/too-many-requests': 'محاولات كتير، استنى شوية وجرب تاني.',
        'auth/network-request-failed': 'مفيش اتصال بالإنترنت.',
        'permission-denied': 'مفيش صلاحية للعملية دي.'
    };
    return m[e && e.code] || ('حصل خطأ: ' + ((e && (e.code || e.message)) || e));
}

/* ================= State ================= */
let user = null, myId = null, isAdmin = false, authReady = false;
let shops = [], shopsLoaded = false;
let support = DEFAULT_SUPPORT.slice();
let products = [], productsShopId = null, productsUnsub = null;
let directory = [], dirUnsub = null, dirLoaded = false;
let builtKey = null;
let currentFilter = 'all', searchText = '', sortBy = 'new', dirSearch = '';
let dash = { logo: undefined, icon: '' };
let adminSig = '';

const view = () => $('#view');
const shopById = id => shops.find(s => s.id === id);

/* ================= Data listeners ================= */
if (configured) {
    onSnapshot(query(collection(db, 'shops'), orderBy('createdAt', 'desc')), snap => {
        shops = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        shopsLoaded = true;
        render();
    }, err => toast(authError(err)));

    onSnapshot(doc(db, 'settings', 'main'), snap => {
        const arr = snap.exists() ? snap.data().supportPhones : null;
        support = Array.isArray(arr) && arr.length ? arr : DEFAULT_SUPPORT.slice();
        renderFooter();
        const f = $('#forgotBox'); if (f && !f.classList.contains('hidden')) fillForgot();
    }, () => {});

    onAuthStateChanged(auth, async u => {
        user = u;
        myId = (u && u.email && u.email.endsWith(EMAIL_DOMAIN)) ? u.email.split('@')[0] : null;
        isAdmin = false;
        if (u) {
            try { isAdmin = (await getDoc(doc(db, 'admins', u.uid))).exists(); } catch { isAdmin = false; }
        }
        authReady = true;
        builtKey = null;
        render();
    });
} else {
    authReady = true; shopsLoaded = true;
}

function ensureProducts(shopId) {
    if (productsShopId === shopId) return;
    if (productsUnsub) { productsUnsub(); productsUnsub = null; }
    products = []; productsShopId = shopId;
    if (!shopId || !configured) return;
    productsUnsub = onSnapshot(
        query(collection(db, 'shops', shopId, 'products'), orderBy('createdAt', 'desc')),
        snap => {
            if (productsShopId !== shopId) return;
            products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            renderProductsArea();
            updateDashboardMeta();
        },
        err => toast(authError(err))
    );
}

function ensureDirectory(on) {
    if (!on) { if (dirUnsub) { dirUnsub(); dirUnsub = null; dirLoaded = false; } return; }
    if (dirUnsub || !configured) return;
    dirUnsub = onSnapshot(query(collection(db, 'directory'), orderBy('createdAt', 'desc')), snap => {
        directory = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        dirLoaded = true;
        renderDirectory();
    }, err => toast(authError(err)));
}

/* ================= Router ================= */
window.addEventListener('hashchange', render);

function parseRoute() {
    const h = (location.hash || '#').replace(/^#/, '');
    const [name, arg] = h.split('/');
    return { name: name || 'home', arg: arg ? decodeURIComponent(arg) : null };
}

function render() {
    renderHeader();
    const r = parseRoute();
    const needsProducts = r.name === 'shop' ? r.arg : (r.name === 'dashboard' ? (r.arg || myId) : null);
    ensureProducts(needsProducts);
    ensureDirectory(r.name === 'directory');

    const key = r.name + '/' + (r.arg || '');
    if (key !== builtKey) {
        builtKey = key;
        if (!buildView(r)) builtKey = null;
    }
    updateView(r);
}

function buildView(r) {
    if (r.name === 'shop' && r.arg) return buildShop(r.arg);
    if (r.name === 'dashboard') return buildDashboard(r.arg || myId);
    if (r.name === 'admin') return buildAdmin();
    if (r.name === 'directory') return buildDirectory();
    return buildHome();
}

function updateView(r) {
    if (builtKey === null) return;
    if (r.name === 'shop' && r.arg) { fillShopHead(r.arg); renderProductsArea(); }
    else if (r.name === 'dashboard') { updateDashboardMeta(); renderProductsArea(); }
    else if (r.name === 'admin') { renderAdminList(); }
    else if (r.name === 'directory') { renderDirectory(); }
    else { renderCats(); renderGrid(); }
}

/* ================= Header / Footer ================= */
function renderHeader() {
    const box = $('#authButtons');
    const btn = 'px-3 py-1.5 rounded-lg text-sm font-semibold transition';
    const r = parseRoute();
    if (!user) {
        box.innerHTML = `
            <button data-action="openRegister" class="${btn} bg-amber-400 text-emerald-950 font-bold shadow hover:bg-amber-300"><i class="fa-solid fa-plus ml-1"></i> سجل محلك</button>
            <button data-action="openLogin" class="${btn} bg-white/10 hover:bg-white/20">دخول</button>`;
    } else {
        box.innerHTML = `
            ${isAdmin ? `<a href="#admin" class="${btn} bg-amber-400 text-emerald-950 font-bold">المدير</a>` : ''}
            <a href="#dashboard" class="${btn} bg-white/10 hover:bg-white/20">محلي</a>
            <button data-action="logout" class="${btn} bg-white/10 hover:bg-white/20">خروج</button>`;
    }
    const on = 'bg-white text-emerald-800 rounded-t-lg', off = 'text-emerald-50 hover:bg-white/10 rounded-t-lg';
    $('#navDir').className = 'px-4 py-2 ' + (r.name === 'directory' ? on : off);
    $('#navHome').className = 'px-4 py-2 ' + (r.name !== 'directory' ? on : off);
}

function renderFooter() {
    $('#supportBox').innerHTML = `مشكلة في الموقع أو نسيت كلمة المرور؟ كلمنا: ` +
        support.map(p => `<a href="${waLink(p, 'مرحباً، عندي مشكلة في موقع خدمات السواقي')}" target="_blank" rel="noopener" class="text-emerald-700 font-bold underline mx-1" dir="ltr">${esc(p)}</a>`).join('');
}

function avatar(s, size) {
    const base = `${size} rounded-2xl shrink-0 flex items-center justify-center overflow-hidden bg-emerald-50`;
    if (safeImg(s.logo)) return `<div class="${base}"><img src="${s.logo}" alt="" class="w-full h-full object-cover"></div>`;
    return `<div class="${base} text-2xl">${esc(s.icon || CAT_ICON[s.category] || '🏪')}</div>`;
}

const openBadge = s => (s.open === false)
    ? `<span class="bg-red-50 text-red-600 px-2 py-0.5 rounded-full font-bold">مغلق الآن</span>`
    : `<span class="bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded-full font-bold">مفتوح</span>`;

/* ================= Home ================= */
function buildHome() {
    view().innerHTML = `
        <div class="bg-gradient-to-r from-emerald-600 to-teal-700 text-white p-6 rounded-2xl shadow-lg mb-6 text-center">
            <h2 class="text-2xl md:text-3xl font-black mb-2">دليل محلات وخدمات القرية</h2>
            <p class="text-emerald-100 text-sm mb-4">تصفح محلات السواقي، شاهد المنتجات والعروض، وتواصل مباشرة مع أصحابها</p>
            <div class="max-w-md mx-auto relative">
                <input type="text" id="searchInput" value="${esc(searchText)}" placeholder="ابحث باسم المحل أو الخدمة..." class="w-full py-3 px-4 pr-10 rounded-xl text-gray-800 focus:outline-none shadow">
                <i class="fa-solid fa-magnifying-glass absolute top-4 right-4 text-gray-400"></i>
            </div>
        </div>
        <div class="mb-6">
            <h3 class="font-bold text-gray-700 mb-3 text-lg"><i class="fa-solid fa-list ml-2 text-emerald-600"></i>الأقسام</h3>
            <div id="cats" class="flex gap-2 overflow-x-auto pb-2"></div>
        </div>
        <div class="flex items-center justify-between mb-3">
            <h3 class="font-bold text-gray-700 text-lg"><i class="fa-solid fa-shop ml-2 text-emerald-600"></i>المحلات المتاحة</h3>
            <select id="sortSel" class="text-sm border rounded-lg px-2 py-1 bg-white">
                <option value="new">الأحدث</option>
                <option value="visits">الأكثر زيارة</option>
            </select>
        </div>
        <div id="shopsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>`;
    $('#sortSel').value = sortBy;
    return true;
}

function renderCats() {
    const box = $('#cats'); if (!box) return;
    const on = 'bg-emerald-700 text-white shadow';
    const off = 'bg-white text-gray-700 border border-gray-200 shadow-sm hover:bg-gray-50';
    box.innerHTML = ['all', ...CATEGORIES].map(c =>
        `<button data-action="cat" data-cat="${esc(c)}" class="px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition ${currentFilter === c ? on : off}">${c === 'all' ? 'الكل' : esc(c)}</button>`
    ).join('');
}

function renderGrid() {
    const grid = $('#shopsGrid'); if (!grid) return;
    if (!shopsLoaded) { grid.innerHTML = `<div class="col-span-full text-center py-10 text-gray-400">جاري التحميل...</div>`; return; }
    const q = searchText.trim().toLowerCase();
    let list = shops.filter(s =>
        (currentFilter === 'all' || s.category === currentFilter) &&
        (!q || (s.name || '').toLowerCase().includes(q) || (s.about || '').toLowerCase().includes(q))
    );
    if (sortBy === 'visits') list = list.slice().sort((a, b) => (b.visits || 0) - (a.visits || 0));
    if (!list.length) {
        grid.innerHTML = `<div class="col-span-full text-center py-10 text-gray-400">لا توجد محلات في هذا القسم حالياً</div>`;
        return;
    }
    grid.innerHTML = list.map(s => `
        <a href="#shop/${esc(s.id)}" class="block bg-white rounded-2xl shadow-sm border border-gray-100 p-4 hover:shadow-md transition">
            <div class="flex items-center gap-3">
                ${avatar(s, 'w-14 h-14')}
                <div class="min-w-0 flex-1">
                    <h4 class="font-bold text-gray-800 truncate">${esc(s.name)}</h4>
                    <span class="text-xs bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded-full font-bold">${esc(s.category)}</span>
                </div>
            </div>
            <div class="flex items-center justify-between mt-3 text-xs">
                ${openBadge(s)}

// زائر واحد لكل جهاز في اليوم
function countVisit(shopId) {
    if (!configured || shopId === myId) return;
    const today = new Date().toISOString().slice(0, 10);
    const key = 'sv_' + shopId;
    try { if (localStorage.getItem(key) === today) return; } catch {}
    updateDoc(doc(db, 'shops', shopId), { visits: increment(1) })
        .then(() => { try { localStorage.setItem(key, today); } catch {} })
        .catch(() => {});
}

function productCard(p, i, mode, shop) {
    const img = safeImg(p.image) ? `<img src="${p.image}" alt="" loading="lazy" data-action="zoom" data-i="${i}" class="w-full h-44 object-cover cursor-zoom">` : '';
    const action = mode === 'vendor'
        ? `<button data-action="delProduct" data-id="${esc(p.id)}" class="block w-full bg-red-50 text-red-600 hover:bg-red-100 py-2.5 rounded-xl text-xs font-bold"><i class="fa-solid fa-trash ml-1"></i> حذف المنتج</button>`
        : `<a href="${waLink(shop.phone, 'أريد طلب هذا المنتج: ' + p.name)}" target="_blank" rel="noopener" class="block bg-emerald-600 hover:bg-emerald-700 text-white text-center py-2.5 rounded-xl text-xs font-bold shadow transition"><i class="fa-brands fa-whatsapp ml-1"></i> اطلب عبر الواتساب</a>`;
    return `
        <div class="border rounded-2xl overflow-hidden bg-white shadow-sm flex flex-col justify-between">
            ${img}
            <div class="p-4 flex-grow">
                <h4 class="font-bold text-gray-800">${esc(p.name)}</h4>

                        <a href="#dashboard/${esc(s.id)}" class="bg-amber-50 text-amber-700 px-3 py-1.5 rounded-lg font-semibold">إدارة</a>
                        <button data-action="adminDelShop" data-id="${esc(s.id)}" class="bg-red-50 text-red-600 hover:bg-red-100 px-3 py-1.5 rounded-lg font-semibold">حذف المحل</button>
                    </div>
                </div>
            </div>`).join('') || '<p class="text-gray-400">لا توجد محلات.</p>';
    }
    const total = shops.reduce((a, s) => a + (s.visits || 0), 0);
    const st = $('#adminStats');
    if (st) st.textContent = `عدد المحلات: ${shops.length} · إجمالي الزيارات: ${total}`;
}

/* ---------- Backup / Restore ---------- */
const toPlain = d => { const o = {}; for (const k in d) { const v = d[k]; o[k] = (v && typeof v.toMillis === 'function') ? { __ts: v.toMillis() } : v; } return o; };
const fromPlain = d => { const o = {}; for (const k in d) { const v = d[k]; o[k] = (v && typeof v === 'object' && '__ts' in v) ? Timestamp.fromMillis(v.__ts) : v; } return o; };

async function doBackup() {
    toast('جاري تجهيز النسخة...');
    const out = { app: 'sawaqi', version: 1, exportedAt: Date.now(), settings: null, shops: [], directory: [] };
    const st = await getDoc(doc(db, 'settings', 'main'));
    if (st.exists()) out.settings = toPlain(st.data());
    const sSnap = await getDocs(collection(db, 'shops'));
    for (const d of sSnap.docs) {
        const p = await getDocs(collection(db, 'shops', d.id, 'products'));
        out.shops.push({ id: d.id, data: toPlain(d.data()), products: p.docs.map(x => ({ id: x.id, data: toPlain(x.data()) })) });
    }
    const dSnap = await getDocs(collection(db, 'directory'));
    out.directory = dSnap.docs.map(d => ({ id: d.id, data: toPlain(d.data()) }));

    const blob = new Blob([JSON.stringify(out)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `sawaqi-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast(`تم تحميل النسخة: ${out.shops.length} محل و ${out.directory.length} رقم`);
}

async function doRestore(file) {
    let data;
    try { data = JSON.parse(await file.text()); } catch { return toast('الملف غير صالح.'); }
    if (!data || data.app !== 'sawaqi' || !Array.isArray(data.shops)) return toast('ده مش ملف نسخة احتياطية للموقع.');
    const nProducts = data.shops.reduce((a, s) => a + (s.products || []).length, 0);
    if (!confirm(`هيتم استعادة ${data.shops.length} محل و ${nProducts} منتج و ${(data.directory || []).length} رقم. البيانات الموجودة بنفس الأرقام هتتكتب فوقها. نكمل؟`)) return;

    const ops = [];
    if (data.settings) ops.push([doc(db, 'settings', 'main'), fromPlain(data.settings)]);
    for (const s of data.shops) {
        ops.push([doc(db, 'shops', s.id), fromPlain(s.data)]);
        for (const p of (s.products || [])) ops.push([doc(db, 'shops', s.id, 'products', p.id), fromPlain(p.data)]);
    }
    for (const d of (data.directory || [])) ops.push([doc(db, 'directory', d.id), fromPlain(d.data)]);

    toast('جاري الاستعادة...');
    for (let i = 0; i < ops.length; i += 300) {
        const b = writeBatch(db);
        ops.slice(i, i + 300).forEach(([ref, d]) => b.set(ref, d));
        await b.commit();
    }
    toast('تمت الاستعادة بنجاح.');
}

/* ================= Auth modal ================= */
function showAuth(tab) {
    $('#rCategory').innerHTML = CATEGORIES.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
    $('#authModal').classList.remove('modal-hidden');
    setTab(tab);
}
function setTab(tab) {
    const on = 'bg-emerald-600 text-white', off = 'bg-gray-100 text-gray-600';
    $('#loginForm').classList.toggle('hidden', tab !== 'login');
    $('#registerForm').classList.toggle('hidden', tab !== 'register');
    $('#tabLogin').className = `flex-1 py-2 rounded-xl font-bold text-sm ${tab === 'login' ? on : off}`;
    $('#tabRegister').className = `flex-1 py-2 rounded-xl font-bold text-sm ${tab === 'register' ? on : off}`;
}
const closeAuth = () => $('#authModal').classList.add('modal-hidden');

function fillForgot() {
    $('#forgotBox').innerHTML = `كلّم الدعم على واتساب وقولهم رقمك، وهيتم تجهيز حسابك من جديد ومحلك ومنتجاتك بترجع زي ما هي:<br>` +
        support.map(p => `<a href="${waLink(p, 'نسيت كلمة المرور. رقمي: ')}" target="_blank" rel="noopener" class="font-bold underline mx-1" dir="ltr">${esc(p)}</a>`).join(' ');
}

$('#loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    if (!configured) return toast('اربط Firebase الأول.');
    const phone = normPhone($('#lPhone').value);
    if (!validPhone(phone)) return toast('اكتب رقم موبايل مصري صحيح (مثال: 01012345678)');
    try {
        await signInWithEmailAndPassword(auth, phoneEmail(phone), $('#lPass').value);
        closeAuth(); e.target.reset();
        toast('تم تسجيل الدخول');
        location.hash = '#dashboard';
    } catch (err) { toast(authError(err)); }
});

$('#registerForm').addEventListener('submit', async e => {
    e.preventDefault();
    if (!configured) return toast('اربط Firebase الأول.');
    const name = $('#rShopName').value.trim();
    const phone = normPhone($('#rPhone').value);
    const pass = $('#rPass').value;
    if (!validPhone(phone)) return toast('اكتب رقم موبايل مصري صحيح (مثال: 01012345678)');
    if (pass.length < 6) return toast('كلمة المرور 6 حروف أو أرقام على الأقل.');
    const id = intl(phone);
    if (shops.some(s => s.id !== id && (s.name || '').trim() === name)) return toast('اسم المحل مسجل قبل كده، اختار اسم تاني.');
    try {
        const existing = await getDoc(doc(db, 'shops', id));
        await createUserWithEmailAndPassword(auth, phoneEmail(phone), pass);
        if (!existing.exists()) {
            await setDoc(doc(db, 'shops', id), {
                name, category: $('#rCategory').value, phone,
                about: '', hours: '', address: '', logo: '', icon: '',
                open: true, visits: 0, productCount: 0, createdAt: serverTimestamp()
            });
            toast('تم إنشاء محلك! ابدأ أضف منتجاتك');
        } else {
            toast('تم ربط حسابك بمحلك الموجود.');
        }
        closeAuth(); e.target.reset();
        location.hash = '#dashboard';
    } catch (err) { toast(authError(err)); }
});

/* ================= Forms inside views ================= */
document.addEventListener('submit', async e => {
    const f = e.target.id;
    try {
        if (f === 'productForm') {
            e.preventDefault();
            const id = dashShopId();
            if (!id) return;
            if (products.length >= MAX_PRODUCTS) return toast(`وصلت للحد الأقصى (${MAX_PRODUCTS} منتج). احذف منتج قديم الأول.`);
            const btn = $('#pSubmit'); btn.disabled = true; btn.textContent = 'جاري الحفظ...';
            try {
                const file = $('#pImage').files[0];
                const image = file ? await compressImage(file, { max: 500, quality: 0.7, limit: 110000 }) : '';
                const pRef = doc(collection(db, 'shops', id, 'products'));
                const b = writeBatch(db);
                b.set(pRef, { name: $('#pName').value.trim(), price: $('#pPrice').value.trim(), desc: $('#pDesc').value.trim(), image, createdAt: serverTimestamp() });
                b.update(doc(db, 'shops', id), { productCount: increment(1) });
                await b.commit();
                e.target.reset(); $('#pPreview').classList.add('hidden');
                toast('تم إضافة المنتج');
            } finally { btn.disabled = false; btn.textContent = 'إضافة المنتج'; }
        }
        else if (f === 'shopForm') {
            e.preventDefault();
            const id = dashShopId();
            const name = $('#eName').value.trim();
            if (shops.some(s => s.id !== id && (s.name || '').trim() === name)) return toast('اسم المحل مستخدم، اختار اسم تاني.');
            const upd = {
                name, category: $('#eCategory').value,
                about: $('#eAbout').value.trim(), hours: $('#eHours').value.trim(), address: $('#eAddress').value.trim(),
                open: $('#eOpen').checked, icon: dash.icon || ''
            };
            if (dash.logo !== undefined) upd.logo = dash.logo;
            await updateDoc(doc(db, 'shops', id), upd);
            dash.logo = undefined;
            toast('تم حفظ البيانات');
        }
        else if (f === 'dirForm') {
            e.preventDefault();
            const phone = normPhone($('#dPhone').value);
            if (!validPhone(phone)) return toast('اكتب رقم موبايل مصري صحيح.');
            if (directory.some(x => x.phone === phone)) return toast('الرقم ده موجود في الدليل قبل كده.');
            let last = 0; try { last = +localStorage.getItem('dir_last') || 0; } catch {}
            if (!isAdmin && Date.now() - last < 60000) return toast('استنى دقيقة قبل ما تضيف رقم تاني.');
            await addDoc(collection(db, 'directory'), { name: $('#dName').value.trim(), job: $('#dJob').value.trim(), phone, createdAt: serverTimestamp() });
            try { localStorage.setItem('dir_last', String(Date.now())); } catch {}
            e.target.reset();
            toast('تمت الإضافة للدليل');
        }
        else if (f === 'adminShopForm') {
            e.preventDefault();
            const phone = normPhone($('#aPhone').value);
            if (!validPhone(phone)) return toast('اكتب رقم موبايل مصري صحيح.');
            const id = intl(phone);
            if (shopById(id)) return toast('الرقم ده عنده محل بالفعل.');
            await setDoc(doc(db, 'shops', id), {
                name: $('#aName').value.trim(), category: $('#aCat').value, phone,
                about: '', hours: '', address: '', logo: '', icon: '',
                open: true, visits: 0, productCount: 0, createdAt: serverTimestamp()
            });
            e.target.reset();
            toast('تم إضافة المحل');
        }
    } catch (err) { toast(err && err.message && !err.code ? err.message : authError(err)); }
});

document.addEventListener('input', e => {
    if (e.target.id === 'searchInput') { searchText = e.target.value; renderGrid(); }
    if (e.target.id === 'dirSearch') { dirSearch = e.target.value; renderDirectory(); }
});

document.addEventListener('change', async e => {
    const id = e.target.id;
    try {
        if (id === 'sortSel') { sortBy = e.target.value; renderGrid(); }
        else if (id === 'pImage') {
            const f = e.target.files[0], prev = $('#pPreview');
            if (f) { prev.src = URL.createObjectURL(f); prev.classList.remove('hidden'); } else prev.classList.add('hidden');
        }
        else if (id === 'eLogo') {
            const f = e.target.files[0]; if (!f) return;
            const data = await compressImage(f, { max: 160, quality: 0.8, limit: 25000 });
            dash.logo = data; dash.icon = '';
            $('#logoPreview').innerHTML = avatar({ logo: data }, 'w-20 h-20 !text-4xl');
            renderIconPicker();
        }
        else if (id === 'restoreFile') {
            const f = e.target.files[0]; e.target.value = '';
            if (f) await doRestore(f);
        }
    } catch (err) { toast(err && err.message && !err.code ? err.message : authError(err)); }
});

/* ================= Click actions ================= */
document.addEventListener('click', async e => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const a = el.dataset.action;
    try {
        if (a === 'openLogin') showAuth('login');
        else if (a === 'openRegister') showAuth('register');
        else if (a === 'closeAuth') closeAuth();
        else if (a === 'tabLogin') setTab('login');
        else if (a === 'tabRegister') setTab('register');
        else if (a === 'forgot') { fillForgot(); $('#forgotBox').classList.toggle('hidden'); }
        else if (a === 'togglePass') {
            const inp = document.getElementById(el.dataset.target);
            inp.type = inp.type === 'password' ? 'text' : 'password';
        }
        else if (a === 'cat') { currentFilter = el.dataset.cat; renderCats(); renderGrid(); }
        else if (a === 'logout') { await signOut(auth); location.hash = '#'; toast('تم تسجيل الخروج'); }
        else if (a === 'zoom') {
            const p = products[+el.dataset.i];
            if (p && safeImg(p.image)) { $('#lightboxImg').src = p.image; $('#lightbox').classList.remove('modal-hidden'); }
        }
        else if (a === 'closeZoom') $('#lightbox').classList.add('modal-hidden');
        else if (a === 'copy') await copyText(el.dataset.text);
        else if (a === 'pickIcon') { dash.icon = el.dataset.icon; dash.logo = ''; $('#logoPreview').innerHTML = avatar({ icon: dash.icon }, 'w-20 h-20 !text-4xl'); renderIconPicker(); }
        else if (a === 'rmLogo') { dash.logo = ''; $('#logoPreview').innerHTML = avatar({ icon: dash.icon }, 'w-20 h-20 !text-4xl'); }
        else if (a === 'delProduct') {
            if (!confirm('تأكيد حذف المنتج؟')) return;
            const id = dashShopId();
            const b = writeBatch(db);
            b.delete(doc(db, 'shops', id, 'products', el.dataset.id));
            b.update(doc(db, 'shops', id), { productCount: increment(-1) });
            await b.commit();
            toast('تم حذف المنتج');
        }
        else if (a === 'delDir') {
            if (confirm('حذف الرقم ده من الدليل؟')) await deleteDoc(doc(db, 'directory', el.dataset.id));
        }
        else if (a === 'saveSupport') {
            const nums = [...new Set($('#sPhones').value.split(/[\n,،]+/).map(normPhone).filter(validPhone))].slice(0, 5);
            if (!nums.length) return toast('اكتب رقم واحد صحيح على الأقل.');
            await setDoc(doc(db, 'settings', 'main'), { supportPhones: nums });
            toast('تم حفظ أرقام الدعم');
        }
        else if (a === 'backup') await doBackup();
        else if (a === 'adminDelShop') {
            const id = el.dataset.id;
            if (!confirm('حذف المحل وكل منتجاته نهائياً؟')) return;
            const snap = await getDocs(collection(db, 'shops', id, 'products'));
            await Promise.all(snap.docs.map(d => deleteDoc(d.ref)));
            await deleteDoc(doc(db, 'shops', id));
            toast('تم حذف المحل');
        }
    } catch (err) { toast(authError(err)); }
});

$('#authModal').addEventListener('click', e => { if (e.target.id === 'authModal') closeAuth(); });

renderFooter();
render();
</script>
